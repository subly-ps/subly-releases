<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#5b6cf0"/><stop offset="1" stop-color="#3fb59f"/></linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9aa3b2"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="360" rx="18" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="959" height="359" rx="18" fill="none" stroke="#e3e6ec"/>

  <!-- Tài khoản chính -->
  <g transform="translate(30,30)">
    <rect width="270" height="300" rx="14" fill="#eef1ff"/>
    <rect x="18" y="18" width="128" height="28" rx="14" fill="#5b6cf0"/>
    <text x="82" y="37" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Tài khoản CHÍNH</text>
    <!-- gamepad -->
    <path d="M78 92 h114 a34 34 0 0 1 34 34 l8 46 a20 20 0 0 1 -36 14 l-18 -26 h-90 l-18 26 a20 20 0 0 1 -36 -14 l8 -46 a34 34 0 0 1 34 -34 z" fill="#1b2130"/>
    <rect x="80" y="122" width="8" height="26" rx="2" fill="#9aa3b2"/><rect x="71" y="131" width="26" height="8" rx="2" fill="#9aa3b2"/>
    <circle cx="186" cy="124" r="5" fill="#9aa3b2"/><circle cx="198" cy="136" r="5" fill="#9aa3b2"/><circle cx="174" cy="136" r="5" fill="#9aa3b2"/><circle cx="186" cy="148" r="5" fill="#9aa3b2"/>
    <text x="135" y="232" text-anchor="middle" font-size="15" font-weight="700" fill="#1b2130">Bạn chơi game</text>
    <text x="135" y="256" text-anchor="middle" font-size="14" fill="#4a5263">bằng tay cầm, nhìn TV</text>
    <text x="135" y="278" text-anchor="middle" font-size="14" fill="#4a5263">như bình thường</text>
  </g>
  <line x1="306" y1="180" x2="352" y2="180" stroke="#9aa3b2" stroke-width="3" marker-end="url(#ar)"/>

  <!-- Máy PX5 + TV -->
  <g transform="translate(360,30)">
    <rect width="240" height="300" rx="14" fill="#f5f7fb"/>
    <rect x="50" y="22" width="140" height="86" rx="6" fill="#1b2130"/>
    <rect x="56" y="28" width="128" height="74" rx="3" fill="#3b5068"/>
    <rect x="66" y="80" width="108" height="15" rx="3" fill="#000" fill-opacity="0.65"/>
    <text x="120" y="91" text-anchor="middle" font-size="9.5" fill="#fff">Phụ đề tiếng Việt</text>
    <rect x="112" y="108" width="16" height="10" fill="#1b2130"/><rect x="96" y="118" width="48" height="5" rx="2" fill="#1b2130"/>
    <text x="120" y="142" text-anchor="middle" font-size="13" fill="#4a5263">TV (app SublyTV)</text>
    <rect x="88" y="166" width="64" height="74" rx="10" fill="#ffffff" stroke="#1b2130" stroke-width="3"/>
    <rect x="102" y="178" width="36" height="6" rx="3" fill="#1b2130"/>
    <text x="120" y="270" text-anchor="middle" font-size="16" font-weight="700" fill="#1b2130">Máy PX5</text>
    <text x="120" y="290" text-anchor="middle" font-size="13" fill="#4a5263">đăng nhập cả 2 tài khoản</text>
  </g>
  <line x1="652" y1="180" x2="606" y2="180" stroke="#9aa3b2" stroke-width="3" marker-end="url(#ar)"/>

  <!-- Tài khoản phụ -->
  <g transform="translate(660,30)">
    <rect width="270" height="300" rx="14" fill="#e9f7f3"/>
    <rect x="18" y="18" width="118" height="28" rx="14" fill="#3fb59f"/>
    <text x="77" y="37" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Tài khoản PHỤ</text>
    <rect x="70" y="70" width="130" height="80" rx="6" fill="#1b2130"/><rect x="76" y="76" width="118" height="68" rx="3" fill="url(#g)"/>
    <text x="135" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Subly</text>
    <text x="135" y="124" text-anchor="middle" font-size="10.5" fill="#fff">Remote Play</text>
    <rect x="58" y="150" width="154" height="9" rx="4" fill="#9aa3b2"/>
    <text x="135" y="210" text-anchor="middle" font-size="15" font-weight="700" fill="#1b2130">Remote Play trong Subly</text>
    <text x="135" y="234" text-anchor="middle" font-size="14" fill="#4a5263">chỉ để đọc phụ đề game</text>
    <text x="135" y="256" text-anchor="middle" font-size="14" fill="#4a5263">rồi dịch, gửi lên TV.</text>
    <text x="135" y="278" text-anchor="middle" font-size="14" fill="#4a5263">Không cần cầm máy này.</text>
  </g>
</svg>
